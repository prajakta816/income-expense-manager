<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Income Expense Manager</title>

    <!-- prebuilt bootstrap CSS  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Goggle font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- custom css -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="register-body">

    <form id="loginForm" class="register-box">
        <a href="index.html" class="register-logo">
            <img src="assets/images/logo.png" alt="">
            <span>FinanceTracker</span>
        </a>

        <h2>Login to your Account</h2>
        <p>Please enter your details to login</p>

        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter your email" required>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" required>

        <button type="submit" id="loginBtn" class="register-btn">
            <!-- Prebuilt: Bootstrap Spinner -->
            <span id="btnSpinner" class="spinner-border spinner-border-sm me-2 d-none" role="status"></span>
            <span id="btnText">Login</span>
        </button>

        <p class="login-link">
            Don't have an account?<a href="register.html">Register</a>
        </p>
    </form>

    <!-- Prebuilt: Bootstrap Toast Container -->
    <div class="toast-container position-fixed top-0 end-0 p-3">
        <div id="liveToast" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive"
            aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">
                    Login successful! Redirecting to dashboard...
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- Prebuilt: Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom Login Script -->
    <script src="js/login.js"></script>

</body>

</html>
