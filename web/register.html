<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Income Expense Manager</title>

    <!-- Prebuilt: Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="register-body">

    <form id="registerForm" class="register-box" novalidate>

        <a href="index.html" class="register-logo">
            <img src="assets/images/logo.png" alt="Logo">
            <span><span>Finance</span>Tracker</span>
        </a>

        <h2>Create Account</h2>
        <p>Please enter your details to sign up</p>

        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Enter your full name" required aria-describedby="nameError">
        <div id="nameError" class="field-error" aria-live="polite"></div>

        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter your email" autocomplete="email" required aria-describedby="emailError">
        <div id="emailError" class="field-error" aria-live="polite"></div>

        <label for="password">Password</label>
        <div class="password-field">
            <input type="password" id="password" placeholder="Enter password" autocomplete="new-password" required minlength="8" aria-describedby="passwordError">
            <button type="button" class="password-toggle" data-target="password" aria-label="Show password" aria-pressed="false">show</button>
        </div>
        <div id="passwordError" class="field-error" aria-live="polite"></div>

        <label for="confirm">Confirm Password</label>
        <div class="password-field">
            <input type="password" id="confirm" placeholder="Confirm password" autocomplete="new-password" aria-describedby="confirmError">
            <button type="button" class="password-toggle" data-target="confirm" aria-label="Show confirm password" aria-pressed="false">show</button><!--aria-pressed this attribute indicates whether the button is currently pressed -->
        </div>
        <div id="confirmError" class="field-error" aria-live="polite"></div>

        <label for="gender">Gender</label>
        <div class="select-field">
            <select id="gender" required aria-describedby="genderError">
                <option value="" disabled selected>Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>
            <button type="button" id="clearGender" class="gender-clear" aria-label="Clear gender selection" hidden>&times;</button>
        </div>
        <div id="genderError" class="field-error" aria-live="polite"></div>

        <button type="submit" id="registerBtn" class="register-btn">
            <!-- Prebuilt: Bootstrap Spinner -->
            <span id="btnSpinner" class="spinner-border spinner-border-sm me-2 d-none" role="status"></span>
            <span id="btnText">Register</span>
        </button>

        <p class="login-link">
            Already have an account? <a href="login.html">Login</a>
        </p>

    </form>

    <!-- Prebuilt: Bootstrap Toast Container -->
    <div class="toast-container position-fixed top-0 end-0 p-3">
        <div id="liveToast" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">
                     Registration successful! Redirecting to login...
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- Prebuilt: Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom Register Script -->
    <script src="js/register.js"></script>
</body>

</html>
