<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Finance | Income Expense Manager</title>

    <!-- Prebuilt: Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Prebuilt: Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- Prebuilt: Bootstrap Navbar for Header -->
    <nav class="navbar navbar-dark px-4" style="background-color: #111736; border-bottom: 1px solid #1e2850;">
        <a class="navbar-brand d-flex align-items-center gap-2" href="user-dashboard.html">
            <img src="assets/images/logo.png" alt="Logo" height="32">
            <span class="fw-bold">Finance<span style="color: #00bfff;">Tracker</span></span>
        </a>
        <div class="d-flex align-items-center gap-3">
            <span><i class="bi bi-person-circle" style="color: #00bfff;"></i> <span id="userName">User</span></span>
            <button id="logoutBtn" class="logout-btn">
                <i class="bi bi-box-arrow-right me-1"></i> Logout
            </button>
        </div>
    </nav>

    <!-- Layout = Sidebar + Content -->
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <p class="sidebar-title">Menu</p>

            <a href="user-dashboard.html" class="active">
                <i class="bi bi-wallet2"></i> My Finance
            </a>
        </aside>

        <!-- Main Content -->
        <main class="dashboard-content">
            <h2>My Personal Finance</h2>
            <p class="welcome-text">Welcome Back,
                <span id="welcomeName">User</span>! Track and manage your income and expenses.
            </p>

            <!-- Cards Grid -->
            <div class="cards-grid mb-4">
                <!-- 1st Card: Total Income -->
                <div class="stat-card">
                    <div>
                        <p>Total Income</p>
                        <h3 id="totalIncome">₹0</h3>
                    </div>
                    <i class="bi bi-graph-up-arrow icon-cyan"></i>
                </div>

                <!-- 2nd Card: Total Expenses -->
                <div class="stat-card">
                    <div>
                        <p>Total Expenses</p>
                        <h3 id="totalExpense">₹0</h3>
                    </div>
                    <i class="bi bi-graph-down-arrow icon-pink"></i>
                </div>

                <!-- 3rd Card: Net Balance -->
                <div class="stat-card">
                    <div>
                        <p>Net Balance</p>
                        <h3 id="netBalance">₹0</h3>
                    </div>
                    <i class="bi bi-wallet2 icon-blue"></i>
                </div>
            </div>

            <!-- Transactions Section Header & Controls -->
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
                <h3 class="m-0" style="font-size: 1.3rem;">Transactions History</h3>
                
                <div class="d-flex flex-wrap align-items-center gap-2">
                    <input type="text" id="searchKeyword" class="form-control form-control-sm bg-dark text-white border-secondary" style="width: 180px;" placeholder="Search title/category...">
                    
                    <select id="filterType" class="form-select form-select-sm bg-dark text-white border-secondary" style="width: 130px;">
                        <option value="All">All Types</option>
                        <option value="Income">Income</option>
                        <option value="Expense">Expense</option>
                    </select>

                    <button class="add-btn" data-bs-toggle="modal" data-bs-target="#transactionModal">
                        <i class="bi bi-plus-lg me-1"></i> Add Entry
                    </button>
                </div>
            </div>

            <!-- Transactions Table -->
            <div class="table-responsive">
                <table class="users-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Title</th>
                            <th>Type</th>
                            <th>Category</th>
                            <th>Amount</th>
                            <th>Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="transactionTableBody">
                        <!-- Rows filled dynamically by user-dashboard.js -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Bootstrap Modal for Add / Edit Transaction -->
    <div class="modal fade" id="transactionModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="transactionModalTitle">Add Transaction</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <input type="hidden" id="transactionId">

                    <div class="mb-3">
                        <label class="form-label">Title / Description</label>
                        <input type="text" id="transactionTitle" class="form-control" placeholder="e.g. Monthly Salary, Grocery Shopping" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Amount (₹)</label>
                        <input type="number" id="transactionAmount" class="form-control" placeholder="e.g. 5000" min="0" step="any" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Transaction Type</label>
                        <select id="transactionType" class="form-select" required>
                            <option value="Income">Income</option>
                            <option value="Expense">Expense</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Category</label>
                        <select id="transactionCategory" class="form-select" required>
                            <option value="Salary">Salary</option>
                            <option value="Freelance">Freelance</option>
                            <option value="Investment">Investment</option>
                            <option value="Food & Dining">Food & Dining</option>
                            <option value="Rent & Housing">Rent & Housing</option>
                            <option value="Utilities">Utilities</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Others">Others</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Date</label>
                        <input type="date" id="transactionDate" class="form-control" required>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="logout-btn" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" id="saveTransactionBtn" class="add-btn">
                        <span id="txSpinner" class="spinner-border spinner-border-sm me-1 d-none"></span>
                        <span id="txSaveText">Save Entry</span>
                    </button>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap Toast Container -->
    <div class="toast-container position-fixed top-0 end-0 p-3">
        <div id="liveToast" class="toast align-items-center text-bg-success border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body" id="toastMsg">Action completed successfully!</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <!-- Prebuilt: Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom User Dashboard Script -->
    <script src="js/user-dashboard.js"></script>
</body>

</html>
