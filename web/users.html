<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users | Income Expense Manager</title>

    <!-- Prebuilt: Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Prebuilt: Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Prebuilt: Bootstrap Navbar -->
    <nav class="navbar navbar-dark px-4" style="background-color: #111736; border-bottom: 1px solid #1e2850;">
        <a class="navbar-brand d-flex align-items-center gap-2" href="dashboard.html">
            <img src="assets/images/logo.png" alt="Logo" height="32">
            <span class="fw-bold">Finance<span style="color: #00bfff;">Tracker</span></span>
        </a>
        <div class="d-flex align-items-center gap-3">
            <span><i class="bi bi-person-circle" style="color: #00bfff;"></i> <span id="userName">User</span></span>
            <button id="logoutBtn" class="logout-btn">
                <i class="bi bi-box-arrow-right me-1"></i> Logout
            </button>
        </div>
    </nav>

    <!-- Layout: Sidebar + Content -->
    <div class="dashboard-layout">

        <!-- Sidebar -->
        <aside class="sidebar">
            <p class="sidebar-title">Menu</p>
            <a href="dashboard.html">
                <i class="bi bi-speedometer2"></i> Dashboard
            </a>
            <a href="users.html" class="active">
                <i class="bi bi-people"></i> Users
            </a>
        </aside>

        <!-- Main Content -->
        <main class="dashboard-content">

            <div class="users-header">
                <div>
                    <h2>Users</h2>
                    <p style="color: rgba(255,255,255,0.6);">Manage all registered users</p>
                </div>
                <!-- Button triggers Add User Modal -->
                <button class="add-btn" data-bs-toggle="modal" data-bs-target="#userModal">
                    <i class="bi bi-person-plus-fill me-1"></i> Add User
                </button>
            </div>

            <!-- Users Table -->
            <table class="users-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Gender</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Rows filled by users.js -->
                </tbody>
            </table>

        </main>
    </div>

    <!-- Prebuilt: Bootstrap Modal for Add / Edit User -->
    <div class="modal fade" id="userModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Add User</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <!-- Hidden: stores id when editing -->
                    <input type="hidden" id="userId">

                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" id="userName2" class="form-control" placeholder="Enter full name">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" id="userEmail" class="form-control" placeholder="Enter email">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" id="userPassword" class="form-control" placeholder="Enter password">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Gender</label>
                        <select id="userGender" class="form-select">
                            <option value="" disabled selected>Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="logout-btn" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" id="saveBtn" class="add-btn">
                        <!-- Prebuilt: Bootstrap Spinner -->
                        <span id="saveSpinner" class="spinner-border spinner-border-sm me-1 d-none"></span>
                        <span id="saveText">Save</span>
                    </button>
                </div>

            </div>
        </div>
    </div>

    <!-- Prebuilt: Bootstrap Toast -->
    <div class="toast-container position-fixed top-0 end-0 p-3">
        <div id="liveToast" class="toast align-items-center text-bg-success border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body" id="toastMsg">Done!</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <!-- Prebuilt: Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom Users Script -->
    <script src="js/users.js"></script>
</body>

</html>
