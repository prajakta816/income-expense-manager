<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dashboard | Income Expense Manager</title>

    <!-- Prebuilt: Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Prebuilt: Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- Prebuilt: Bootstrap Navbar for Header -->
    <nav class="navbar navbar-dark px-4" style="background-color: #111736; border-bottom: 1px solid #1e2850;">
        <a class="navbar-brand d-flex align-items-center gap-2" href="dashboard.html">
            <img src="assets/images/logo.png" alt="Logo" height="32">
            <span class="fw-bold">Finance<span style="color: #00bfff;">Tracker</span></span>
        </a>
        <div class="d-flex align-items-center gap-3">
            <span><i class="bi bi-person-circle" style="color: #00bfff;"></i> <span id="userName">User</span></span>
            <button id="logoutBtn" class="logout-btn">
                <i class="bi bi-box-arrow-right me-1"></i> Logout
            </button>
        </div>
    </nav>

    <!-- layout = sidebar + content-->
    <div class="dashboard-layout">
        <!--sidebar-->
        <aside class="sidebar">
            <p class="sidebar-title">Menu </p>

            <a href="dashboard.html" class="active">
                <!-- Prebuilt: Bootstrap Icon -->
                <i class="bi bi-speedometer2"></i> Dashboard
            </a>

            <a href="users.html">
                <!-- Prebuilt: Bootstrap Icon -->
                <i class="bi bi-people"></i> Users
            </a>
        </aside>

        <!--content-->
        <main class="dashboard-content">
            <h2>Dashboard Overview</h2>
            <p class="swlcome-text">Welcome Back,
                <span id="welcomeName"></span>
                ! Here is your user summary.
            </p>

            <!--now starts card structure-->
            <div class="cards-grid">
                <!--1st card-->
                <div class="stat-card">
                    <div>
                        <p> Total users</p>
                        <h3 id="totalUsersCount">0</h3>
                    </div>
                    <!-- Prebuilt: Bootstrap Icon -->
                    <i class="bi bi-people-fill icon-cyan"></i>
                </div>

                <!--2nd card-->
                <div class="stat-card">
                    <div>
                        <p>User male</p>
                        <h3 id="maleUsersCount">0</h3>
                    </div>
                    <!-- Prebuilt: Bootstrap Icon -->
                    <i class="bi bi-gender-male icon-blue"></i>
                </div>

                <!--3rd card-->
                <div class="stat-card">
                    <div>
                        <p>Female user</p>
                        <h3 id="femaleUsersCount">0</h3>
                    </div>
                    <!-- Prebuilt: Bootstrap Icon -->
                    <i class="bi bi-gender-female icon-pink"></i>
                </div>
            </div>
        </main>
    </div>

    <!-- Prebuilt: Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom Dashboard Script -->
    <script src="js/dashboard.js"></script>

</body>

</html>
